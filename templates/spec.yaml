alerts:
- disabled: true
  rule: DEPLOYMENT_FAILED
- disabled: true
  rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: REPLACE_APP_NAME
    match:
      path:
        prefix: /
maintenance: {}
name: REPLACE_APP_NAME
region: nyc
services:
- dockerfile_path: Dockerfile
  envs:
  - key: REPLACE_ENV_PREFIX_SQL_HOST
    scope: RUN_AND_BUILD_TIME
    value: REPLACE_SQL_HOST
  - key: REPLACE_ENV_PREFIX_SQL_USER
    scope: RUN_AND_BUILD_TIME
    value: REPLACE_SQL_USER
  - key: REPLACE_ENV_PREFIX_SQL_PASSWORD
    scope: RUN_AND_BUILD_TIME
    value: REPLACE_SQL_PASSWORD
  - key: REPLACE_ENV_PREFIX_SQL_DATABASE
    scope: RUN_AND_BUILD_TIME
    value: REPLACE_DB_NAME
  github:
    branch: main
    repo: REPLACE_GIT_REPO
  http_port: REPLACE_HTTP_PORT
  instance_count: 1
  instance_size_slug: REPLACE_APP_SIZE
  name: REPLACE_APP_NAME
  source_dir: /
