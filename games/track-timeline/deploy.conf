# Per-game deployment config for track-timeline.
# Sourced by the gameshell-deploy scripts.

APP_NAME=track-timeline
ENV_VAR_PREFIX=TRACK_TIMELINE
DB_NAME=TRACK_TIMELINE
HTTP_PORT=2016
GIT_REPO=gerp93/track-timeline
GIT_UPSTREAM=
EXTRA_ENV_VARS="+YT_API_KEY +ANTHROPIC_API_KEY"

# Pre-deploy key checks (optional; used by the GUI, ignored by create.sh).
# See deploy.conf.template for the format.
SECRET_CHECK_YT_API_KEY="https://www.googleapis.com/youtube/v3/videos?part=id&id=dQw4w9WgXcQ&key={KEY}"
SECRET_CHECK_ANTHROPIC_API_KEY="https://api.anthropic.com/v1/models|x-api-key: {KEY}|anthropic-version: 2023-06-01"
