name: Release GUI

# Builds the Wails desktop GUI (gui/) for Windows, Linux, and macOS and
# publishes all three as GitHub Release assets whenever a version tag is
# pushed. The app itself is OS-agnostic (see gui/platform/platform_unix.go
# vs platform_windows.go — only Windows shells through wsl.exe).
#
# To cut a release: run the "Cut Release" workflow from the Actions tab
# (pick the branch, type a version) — it tags and pushes, then calls this
# workflow directly (see the `workflow_call` trigger below). Deliberately
# not automatic on every push to a branch: see cut-release.yml and
# CLAUDE.md's Versioning section for why.
#
# Also still runs on a tag push directly (e.g. a local
# `git tag v1.2.3 && git push origin v1.2.3`) — but note that pushing the
# tag from *inside* a workflow using the default GITHUB_TOKEN, like
# cut-release.yml briefly did, does NOT trigger this via the push event:
# GitHub deliberately suppresses workflow runs triggered by the
# GITHUB_TOKEN's own pushes, to stop workflows recursively triggering each
# other. That's why cut-release.yml calls this workflow directly via
# `workflow_call` instead of relying on the tag push to fire it — no
# secret/PAT needed, since a direct call isn't a triggered event at all.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      version:
        description: "Tag being released (e.g. v1.2.3) — only set when called from cut-release.yml; a direct tag push infers it from the ref."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    outputs:
      # Same value written by all 3 matrix legs (last one to finish wins,
      # per GitHub's documented behavior for matrix job outputs) — harmless
      # here since it's identical every time.
      version: ${{ steps.stage.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary: gameshell-deploy-gui.exe
          - os: ubuntu-latest
            platform: linux
            binary: gameshell-deploy-gui
          - os: macos-latest
            platform: macos
            binary: gameshell-deploy-gui
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Explicit for the workflow_call path: without this, checkout
          # defaults to the caller's ref, which happens to be the same
          # commit right after cut-release.yml tags it, but would silently
          # drift if this were ever called for a tag pushed earlier.
          # inputs.version is unset (empty) on a direct tag push, in which
          # case checkout's own default (the ref that triggered it) is
          # already correct, so this is a no-op there.
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || '' }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Ubuntu 24.04 (ubuntu-latest) only ships webkit2gtk 4.1's dev
      # package, not the older 4.0 Wails v2 defaults to — build with the
      # 4.1 tag to match. See https://wails.io/docs/gettingstarted/installation
      # (Linux prerequisites) for why this differs from older distros.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build GUI
        working-directory: gui
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            wails build -tags webkit2_41
          else
            wails build
          fi

      # Package the binary alongside the generic scripts/templates it needs
      # at runtime (see gui/app.go's GetOpsDir — it walks up from its own
      # location looking for these), plus the games/ stubs. Placing the
      # binary at the package root means GetOpsDir finds everything on the
      # first check, no gui/build/bin/ nesting required.
      #
      # macOS is the odd one out: wails build produces a *.app bundle (a
      # directory), not a flat binary — the real executable is nested at
      # <name>.app/Contents/MacOS/<name>. Ship the whole bundle so it stays
      # a normal double-clickable Mac app; GetOpsDir still finds create.sh
      # etc. two levels up from Contents/MacOS just fine (it walks up 6).
      - name: Stage release package
        id: stage
        shell: bash
        run: |
          set -e
          # inputs.version is set when called from cut-release.yml; a direct
          # tag push has no such input, so GITHUB_REF_NAME (the tag name) is
          # the fallback.
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION:-$GITHUB_REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          STAGE="gameshell-deploy-${VERSION}-${{ matrix.platform }}"
          mkdir -p "$STAGE"
          if [ "${{ matrix.platform }}" = "macos" ]; then
            cp -r "gui/build/bin/${{ matrix.binary }}.app" "$STAGE/"
            chmod +x "$STAGE/${{ matrix.binary }}.app/Contents/MacOS/${{ matrix.binary }}"
          else
            cp "gui/build/bin/${{ matrix.binary }}" "$STAGE/"
            chmod +x "$STAGE/${{ matrix.binary }}" || true
          fi
          cp create.sh delete.sh README.md CLAUDE.md "$STAGE/"
          cp -r templates deploy.conf.template games "$STAGE/"
          # Never ship decrypted backups or a stray operator's encrypted
          # ones — only the tracked games/*/deploy.conf + empty backups/
          # dirs (.gitkeep) should be present, but strip defensively in
          # case anything untracked snuck into the workspace.
          find "$STAGE/games" -type f \( -name '*.sql' -o -name '*.gpg' \) -delete

          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a -tzip "${STAGE}.zip" "$STAGE" > /dev/null
            echo "ASSET_PATH=${STAGE}.zip" >> "$GITHUB_ENV"
          else
            tar czf "${STAGE}.tar.gz" "$STAGE"
            echo "ASSET_PATH=${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: ${{ env.ASSET_PATH }}

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit rather than left to action-gh-release's own GITHUB_REF
          # inference: under workflow_call that ref is the caller's branch,
          # not the tag, and would create a release pointed at the wrong
          # thing. inputs.version isn't visible in this job (only the
          # "build" job above received it) — needs.build.outputs.version
          # threads it through instead.
          tag_name: ${{ needs.build.outputs.version }}
          files: dist/*
          generate_release_notes: true
