# Fires a release on every push to this repo's default branch — see
# gerp93/KVG_Standards' templates/auto-release.yml for the full rationale.
# Coexists with cut-release.yml (manual, explicit version); this is the
# default, always-on path.

name: Auto Release

on:
  push:
    branches: [migration/control-plane-scripts]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semantic version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: migration/control-plane-scripts

  release:
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: gerp93/KVG_Standards/.github/workflows/release-go-gui.yml@main
    with:
      version: ${{ needs.version.outputs.new_tag }}
      app_name: gameshell-deploy-gui
      gui_dir: gui
      extra_stage_paths: "create.sh delete.sh README.md CLAUDE.md templates deploy.conf.template games"
      windows_installer_scope: perUser
      windows_installer_preserve_paths: games
    permissions:
      contents: write
