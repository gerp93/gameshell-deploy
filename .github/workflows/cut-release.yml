name: Cut Release

# Manually creates and pushes a version tag, then calls KVG_Standards'
# release-go-gui.yml (build/publish job) directly to build and publish it.
# This workflow exists so cutting a release is a button in the Actions tab
# (pick the branch/ref to tag, type a version) instead of a local
# `git tag && git push`, without making every push to any branch
# automatically ship a release. Nothing here runs on a schedule or on push.
#
# The build workflow is called directly (via `uses:`) rather than relied on
# to fire from the tag push below: GitHub deliberately does not let a push
# made with the default GITHUB_TOKEN (which the tag push below uses)
# trigger other workflows' push events — otherwise workflows could trigger
# each other recursively. A direct call sidesteps that entirely, and needs
# no PAT/secret.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. "1.2.3" or "v1.2.3"'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and normalize version
        id: version
        run: |
          set -e
          RAW="${{ inputs.version }}"
          # Accept with or without a leading v; the tag itself always has one.
          VERSION="v${RAW#v}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$RAW' — expected X.Y.Z or vX.Y.Z (e.g. 1.2.3)." >&2
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          set -e
          # An annotated tag needs a committer, and the runner has no git
          # identity configured by default — this is the standard identity
          # GitHub's own actions (e.g. actions/checkout's auto-commit
          # helpers) use for machine-authored commits/tags.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.version.outputs.version }}"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
          echo "Pushed $VERSION at $(git rev-parse --short HEAD) — handing off to release-go-gui.yml." >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: tag
    uses: gerp93/KVG_Standards/.github/workflows/release-go-gui.yml@main
    with:
      version: ${{ needs.tag.outputs.version }}
      app_name: gameshell-deploy-gui
      gui_dir: gui
      extra_stage_paths: "create.sh delete.sh README.md CLAUDE.md templates deploy.conf.template games"
      version_ldflag_package: main
    permissions:
      contents: write
